name: fieldbook
description: "Personal productivity app: todos, shopping list, Pomodoro timer, notes and flashcards."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.11.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Database
  drift: ^2.14.0
  path: ^1.8.3
  path_provider: ^2.1.1

  # Security (notes are encrypted at rest)
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.0.0

  # Preferences (theme, Pomodoro settings and timer state)
  shared_preferences: ^2.2.2

  # Date formatting
  intl: ^0.18.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  drift_dev: ^2.14.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21
